[project]
name = "codecast-tts"
version = "0.1.0"
description = "Local Kokoro speech sidecar for CodeCast"
requires-python = ">=3.10,<3.14"
dependencies = [
  "kokoro==0.9.4",
  "soundfile==0.13.1",
  "transformers>=4.48,<5",
  "torch>=2.5,<3",
  "spacy>=3.8,<3.9",
  "en-core-web-sm",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
